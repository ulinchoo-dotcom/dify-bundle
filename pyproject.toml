[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dify-bundle"
version = "0.1.0"
description = "把 Dify 应用打成可版本化的交付包：导出 / 校验 / 差异对比 / 一键重建 / 行业模板"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yulin Zhu" }]
keywords = ["dify", "fde", "delivery", "devops", "agent", "llmops"]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dify-bundle = "dify_bundle.cli:main"

[tool.setuptools]
packages = ["dify_bundle"]

[tool.setuptools.package-data]
dify_bundle = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
